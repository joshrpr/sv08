[gcode_macro TPU_U1]
description: Dry TPU in U1 at 60C for 300 min
gcode:
  SET_HEATER_TEMPERATURE HEATER=iDryer_U1_Heater TARGET=60
  UPDATE_DELAYED_GCODE ID=IDRYER_U1_AUTO_OFF DURATION=18000
  RESPOND MSG="U1 TPU drying started: 60C for 300 minutes"

[gcode_macro OFF_U1]
description: Turn off U1 dryer
gcode:
  UPDATE_DELAYED_GCODE ID=IDRYER_U1_AUTO_OFF DURATION=0
  SET_HEATER_TEMPERATURE HEATER=iDryer_U1_Heater TARGET=0
  RESPOND MSG="U1 dryer turned off"

[delayed_gcode IDRYER_U1_AUTO_OFF]
gcode:
  SET_HEATER_TEMPERATURE HEATER=iDryer_U1_Heater TARGET=0
  RESPOND MSG="U1 drying cycle complete. Heater turned off"